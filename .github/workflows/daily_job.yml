name: Daily run

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dagster-run:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run dagster
        run: |
          uv run dg launch --job daily_job --partition $(date --date="yesterday" '+%Y-%m-%d')
        env:
          DAGSTER_HOME: ${{ vars.dagster_home }}
          ENVIRONMENT: prd
          DATA_DIRECTORY_PRD: ${{ vars.data_directory }}
