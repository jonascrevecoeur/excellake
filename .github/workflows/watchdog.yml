# Fail (and send an alert) if runs are stuck for
# more than 10 minutes in queued
name: Detect stuck worfklows

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check queued runs
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: "queued",
              per_page: 100
            });

            let cancelledRuns = [];

            for (const run of data.workflow_runs) {
              const createdAt = new Date(run.created_at);
              const diffMinutes = (now - createdAt) / 1000 / 60;

              core.info(`Run ${run.id} queued for ${diffMinutes.toFixed(1)} minutes`);

              if (diffMinutes > 10) {
                core.info(`Cancelling run ${run.id}`);

                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });

                cancelledRuns.push(run.id);
              }
            }

            core.setOutput("cancelled", cancelledRuns.length > 0 ? "true" : "false");
            core.setOutput("count", cancelledRuns.length);

      - name: Fail if runs were cancelled
        if: steps.check.outputs.cancelled == 'true'
        run: |
          echo "${{ steps.check.outputs.count }} run(s) were stuck in queue too long and got cancelled"
          exit 1
