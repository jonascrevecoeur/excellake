name: Watchdog

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Wait 15 minutes
        run: sleep 10

      - name: Check run status
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.inputs.run_id;

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            core.info(`Run status: ${run.status}`);

            return run.status;

      - name: Cancel if still queued
        if: steps.check.outputs.result == 'queued'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.inputs.run_id;

            core.info(`Cancelling run ${runId} queue timeout`);

            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

      - name: Mark as failed (status check)
        if: steps.check.outputs.result == 'queued'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "failure",
              context: "queue-timeout",
              description: "Workflow cancelled: queued > 15 minutes"
            });

      - name: Fail watchdog
        if: steps.check.outputs.result == 'queued'
        run: |
          echo "Run was queued too long"
          exit 1
